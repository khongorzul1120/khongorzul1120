# Save this file as: .github/workflows/profile-3d.yml
# in the repository named "khongorzul1120" (the profile repo).
#
# It regenerates the 3D contribution calendar every day and commits the SVGs
# into profile-3d-contrib/ so the README can link to them.

name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # 18:00 UTC daily (02:00 next day in Ulaanbaatar, UTC+8)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet || git commit -m "chore: regenerate 3D contribution calendar"
          git push